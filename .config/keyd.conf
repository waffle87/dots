k:05ac:0291

[global]
chord_timeout = 40

[main]
# home row mods
a = overloadt(alt, a, 170)
s = overloadt(meta, s, 170)
d = overloadt(control, d, 170)
f = overloadt(shift, f, 170)
j = overloadt(shift, j, 170)
k = overloadt(control, k, 170)
l = overloadt(meta, l, 170)
; = overloadt(alt, ;, 170)

# other
[ = backspace
leftmeta = esc
space = overloadt(layer1, space, 170)
rightmeta = layer(layer2)

# combos
j+k = enter
d+f = _
f+j = capslock

[layer1]
